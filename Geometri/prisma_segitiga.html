<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prisma Segitiga</title>
</head>
<body>
  <h1>Prisma Segitiga</h1>
  <div>
    <label for="tp">Tinggi Prisma</label>
    <input type="number" id="tp">
  </div>
  <div>
    <label for="alas">Alas</label>
    <input type="number" id="alas">
  </div>
  <div>
    <label for="t">Tinggi</label>
    <input type="number" id="t">
  </div>
  <button id="hitung">Hitung</button>
  <p>
    Luas permukaan = <span id="luasPermukaan"></span>
  </p>
  <p>
    Volume = <span id="volume"></span>
  </p>

  <script>
    const tinggiPrisma = document.getElementById('tp')
    const alas = document.getElementById('alas')
    const tinggi = document.getElementById('t')
    const hitung = document.getElementById('hitung')

    const luasPermukaan = document.getElementById('luasPermukaan')
    const volume = document.getElementById('volume')

    hitung.addEventListener(
      "click", function(){
        let result_luasPermukaan = (parseInt(alas.value) * parseInt(tinggi.value)) * parseInt(tinggiPrisma.value) * 2 * (1/2 * parseInt(alas.value) * parseInt(tinggi.value))
        let result_volume = parseInt(alas.value) * parseInt(tinggi.value) * parseInt(tinggiPrisma.value)

        luasPermukaan.innerHTML = result_luasPermukaan + " cm<sup>2</sup>"
        volume.innerHTML = result_volume + " cm<sup>3</sup>"
      }
    )
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lingkaran</title>
</head>
<body>
  <h1>Rumus Lingkaran</h1>
  <label for="jari">Jari-jari</label>
  <input type="number" id="jari">
  <button id="hitung">Hitung</button>
  <p>
    Keliling : <span id="Keliling"></span>
  </p>
  <p>
    Luas     : <span id="luas"></span>
  </p>

  <script>
    const phi = 3.14
    const jari = document.getElementById('jari')
    const hitung = document.getElementById('hitung')

    const labelKeliling = document.getElementById('Keliling')
    const labelluas = document.getElementById('luas')

    hitung.addEventListener("click", function(){
      let Keliling = 2 * phi * parseInt(jari.value)
      labelKeliling.innerHTML = Keliling + " cm<sup>2</sup>"

      let luas = phi * parseInt(jari.value) ** 2
      labelluas.innerHTML = luas
    })

  </script>
</body>
</html>

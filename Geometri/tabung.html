<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tabung</title>
</head>
<body>
  <h1>Rumus Tabung</h1>
  <label for="jari">Jari-jari</label>
  <input type="number" id="jari">
  <label for="tinggi">Tinggi</label>
  <input type="number" id="tinggi">
  <button id="hitung">Hitung</button>
  <p>
    Volume : <span id="Volume"></span>
  </p>
  <p>
    Luas     : <span id="luas"></span>
  </p>

  <script>
    const phi = 3.14
    const jari = document.getElementById('jari')
    const tinggi = document.getElementById('tinggi')
    const hitung = document.getElementById('hitung')

    const labelVolume = document.getElementById('Volume')
    const labelluas = document.getElementById('luas')

    hitung.addEventListener("click", function(){
      let Volume = phi * parseInt(jari.value)**2 * parseInt(tinggi.value)
      labelVolume.innerHTML = Volume + " cm<sup>3</sup>"

      let luas = 2 * phi * parseInt(jari.value) * parseInt(tinggi.value) + 2 * phi * parseInt(jari.value)**2
      labelluas.innerHTML = luas + " cm<sup>2</sup>"
    })

  </script>
</body>
</html>

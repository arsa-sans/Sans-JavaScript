<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Refleksi Garis x</title>
</head>
<body>
  <h1>Refleksi Garis x</h1>
  <label for="x">Sumbu x</label>
  <input type="number" id="x">
  <label for="y">Sumbu y</label>
  <input type="number" id="y">
  <button id="hitung">Hitung</button>
  <p>
    Hasil refleksi terhadap garis x : <span id="Hasil"></span>
  </p>

  <script>
    const x = document.getElementById('x')
    const y = document.getElementById('y')
    const hitung = document.getElementById('hitung')

    const labelHasil = document.getElementById('Hasil')

    hitung.addEventListener("click", function(){
      let a = parseInt(x.value)
      let b = parseInt(y.value) * - 1

      labelHasil.innerHTML = `(${a}, ${b})`
    })

  </script>
</body>
</html>

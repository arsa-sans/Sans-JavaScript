<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Program angka romawi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Program Angka Romawi</h1>
        <div class="input">
            <label for="sisi">Masukkan bilangan bulat positif:</label>
            <input type="number" id="angka">
        </div>
        <button onclick="angka()">Hitung</button>
        <div id="hasil" class="hasil">
            <p id="out"></p> 
        </div>
    </div>

    <script>
      function angka() {
      const angkaInput = document.getElementById('angka');
      const outOutput = document.getElementById('out');

      const angka = parseInt(angkaInput.value); 

      if (isNaN(angka)) {
          outOutput.textContent = 'Masukkan angka yang valid.';
          return;
      }

      if (angka >= 1 && angka <= 10) {
          const romawi = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X']; 
          outOutput.textContent = `angka ${angka} di romawikan jadi ${romawi[angka - 1]}`;
      } else {
          outOutput.textContent = 'ini bukan angka 1 - 10';
      }
    }
    </script> 
</body>
</html>

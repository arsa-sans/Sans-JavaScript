<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>latihan 2 JS</title>
</head>
<body>
  <div id="angka"></div>
  <div id="nama"></div>
  <div id="alamat"></div>
  <div id="angka1"><b>10</b></div>
  <div id="counter"></div>
  <script>
    const max = 30
    let age = 20
    console.log(`Nilai maksimal adalah ${max} untuk usia ${age}`)

    const divAngka = document.querySelector('#angka')
    const divNama = document.querySelector('#nama')
    const divAlamat = document.querySelector('#alamat');

    let angka = 30
    let nama = 'Arsa'
    let alamat = "Cianjur"

    divAngka.textContent = angka
    divNama.innerHTML = `<b>nama</b>` // eksekusi code dari html
    divAlamat.textContent = `<b>alamat</b>`

    const divAngka1 = document.querySelector('#angka1')
    console.log(divAngka1.innerHTML)

    function perkalian(angka, pengali){
      return angka * pengali
    }
    function kalimat(nama, jk, kelas = 'X PPLG 2'){
      return `Nama kamu adalah ${nama} berjenis kelamin ${jk} di kelas ${kelas}`
    }
    function pangkat(angka, pangkat){
      return angka ** pangkat
    }
    // arrow function
    const pangkatV2 = (angkap, pangkatt) => angkap**pangkatt
    console.log(pangkatV2(11, 2))

    console.log(perkalian(10, 7))
    console.log(kalimat('Arsa', 'laki-laki'))
    console.log(kalimat('Arsa', 'laki-laki', 'X MPLB 2'))
    console.log(pangkat(10, 3))

    // looping
    for (a = 1; a < 6; a++){
      console.log(a)
    }

    // counter
    const divCounter = document.querySelector('#counter')
    let counter = Number(divCounter.textContent)
    const changeNumber = () => {
      counter++
      divCounter.textContent = counter
    }
    setInterval(changeNumber, 1000)
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Energi Potensial</title>
</head>
<body>
  <h1>Energi Potensial</h1>
  <label for="massa">Massa</label>
  <input type="number" id="massa">
  <label for="h">Ketinggian benda</label>
  <input type="number" id="h">
  <label for="g">Gravitasi</label>
  <input type="number" id="g">
  <button id="hitung">Hitung</button>
  <p>
    Energi Potensial : <span id="Hasil"></span>
  </p>

  <script>
    const massa = document.getElementById('massa')
    const ketinggian = document.getElementById('h')
    const hitung = document.getElementById('hitung')
    const gravitasi = document.getElementById('g')

    const labelHasil = document.getElementById('Hasil')

    hitung.addEventListener("click", function(){
      let ep = parseInt(massa.value) * parseInt(gravitasi.value) * parseInt(ketinggian.value)

      labelHasil.innerHTML = `${ep} J`
    })

  </script>
</body>
</html>

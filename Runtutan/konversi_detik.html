<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Konversi Detik</title>
</head>
<body>
  <h1>Konversi Detik</h1>
  <label for="inpDetik">Masukan Detik</label>
  <input type="number" id="inpDetik">
  <button id="hitung">Hitung</button>
  <p>
    Konversi Detik adalah : <span id="hasilKonversi"></span>
  </p>

  <script>
    let prcDetik = document.getElementById('inpDetik')
    const HARI_DETIK = 24 * 60 * 60
    const JAM_DETIK =  60 * 60
    const hitung = document.getElementById('hitung')

    const labelHasil = document.getElementById('hasilKonversi')

    hitung.addEventListener("click", function(){
      let hari = parseInt(prcDetik.value) / HARI_DETIK
      prcDetik = parseInt(prcDetik.value) % HARI_DETIK

      let jam = parseInt(prcDetik.value) / JAM_DETIK
      prcDetik = parseInt(prcDetik.va) % JAM_DETIK

      let menit = parseInt(prcDetik.value) / 60
      prcDetik = parseInt(prcDetik.value) % 60

      labelHasil.innerHTML = `${hari} hari, ${jam} jam, ${menit} menit, ${prcDetik} detik`
    })

  </script>
</body>
</html>

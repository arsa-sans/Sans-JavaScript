<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Konversi Hari</title>
</head>
<body>
  <h1>Konversi Detik</h1>
  <label for="inpMeter">Masukan panjang dalam satuan meter</label>
  <input type="number" id="inpMeter">
  <button id="hitung">Hitung</button>
  <p>
    Konversi Panjang adalah : <span id="hasilKonversi"></span>
  </p>

  <script>
    let prcMeter = document.getElementById('inpMeter')
    const hitung = document.getElementById('hitung')

    const labelHasil = document.getElementById('hasilKonversi')

    hitung.addEventListener("click", function(){
      let inch = parseInt(prcMeter.value) / 39
      prcMeter = parseInt(prcMeter.value) % 39

      let kaki = parseInt(prcMeter.value) / 3
      prcMeter = parseInt(prcMeter.va) % 3
      
      let yard = parseInt(prcMeter.value) / 1
      prcMeter = parseInt(prcMeter.va) % 1

      labelHasil.innerHTML = `${inch} Inch, ${kaki} Kaki, ${yard} Yard`
    })

  </script>
</body>
</html>

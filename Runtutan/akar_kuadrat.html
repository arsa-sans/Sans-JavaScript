<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Program akar kuadrat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Program Akar Kuadrat</h1>
        <div class="input">
            <label for="sisi">Masukan angka:</label>
            <input type="number" id="angka">
        </div>
        <button onclick="ak()">Hitung</button>
        <div id="hasil" class="hasil">
            <p id="out"></p>
        </div>
    </div>

    <script>
      function ak() {
      const angkaInput = document.getElementById('angka');
      const outOutput = document.getElementById('out');

      const angka = parseFloat(angkaInput.value)

      let akar_kuadrat = angka ** 0.5
      outOutput.textContent = `Akar Kuadrat dari ${angka} adalah ${akar_kuadrat}`
}
    </script> 
</body>
</html>

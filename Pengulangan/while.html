<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pengulangan memakai while</title>
</head>
<body>
  <h1>Pengulangan memakai While</h1>
  <button onclick="start()">Klik</button>
  <p id="out"></p>
  <script>
    function start(){
      const out = document.getElementById('out')
      let text = ""
      let i = 0
      while (i < 10) {
        text += "The number is " + i + "<br>";
        i++;
        console.log(text)
      }
      out.innerHTML = `${text}`
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pengulangan memakai for in</title>
</head>
<body>
  <h1>Pengulangan memakai for in</h1>
  <button onclick="start()">Klik</button>
  <p id="out"></p>
  <script>
    function start(){
      const out = document.getElementById('out')
      const numbers = [10, 3, 6, 16, 40];
      let txt = ""
      for (let x in numbers) {
        txt += `${numbers[x]} `
      }
      out.textContent = txt
    }
  </script>
</body>
</html>
